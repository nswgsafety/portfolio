<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,900&amp;display=swap');
    </style>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" fill="#0D0B09"/>

  <!-- Corner marks in accent green -->
  <line x1="6" y1="6" x2="16" y2="6" stroke="#22C55E" stroke-width="1.5"/>
  <line x1="6" y1="6" x2="6" y2="16" stroke="#22C55E" stroke-width="1.5"/>
  <line x1="94" y1="6" x2="84" y2="6" stroke="#22C55E" stroke-width="1.5"/>
  <line x1="94" y1="6" x2="94" y2="16" stroke="#22C55E" stroke-width="1.5"/>
  <line x1="6" y1="94" x2="16" y2="94" stroke="#22C55E" stroke-width="1.5"/>
  <line x1="6" y1="94" x2="6" y2="84" stroke="#22C55E" stroke-width="1.5"/>
  <line x1="94" y1="94" x2="84" y2="94" stroke="#22C55E" stroke-width="1.5"/>
  <line x1="94" y1="94" x2="94" y2="84" stroke="#22C55E" stroke-width="1.5"/>

  <!-- IA. mark -->
  <text
    x="50" y="68"
    text-anchor="middle"
    font-family="'Playfair Display', Georgia, serif"
    font-size="48"
    font-weight="900"
    font-style="italic"
    fill="#EDEAE5"
    letter-spacing="-1"
  >IA<tspan fill="#22C55E">.</tspan></text>
</svg>
