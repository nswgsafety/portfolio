  <text x="48" y="889" font-size="12" fill="#3A5A7A" font-family="system-ui, sans-serif">© 2025–26 ATHS Technology Student Association · Northern New Jersey</text>
  <text x="1352" y="889" text-anchor="end" font-size="12" fill="#3A5A7A" font-family="system-ui, sans-serif">athstsa.club</text>
