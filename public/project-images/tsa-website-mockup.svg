  <text x="104" y="32" font-size="16" font-weight="800" fill="white" font-family="system-ui, sans-serif">ATHS</text>
  <text x="104" y="50" font-size="10" fill="#6BA0D8" font-family="system-ui, sans-serif" letter-spacing="3">TSA CLUB</text>
