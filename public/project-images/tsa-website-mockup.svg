  <text x="976" y="736" font-size="13" fill="#64748B" font-family="system-ui, sans-serif">Fusion 360 · Onshape · AutoCAD</text>
  <text x="976" y="756" font-size="13" fill="#64748B" font-family="system-ui, sans-serif">Drone frames · Wrist module · Brackets</text>
  <text x="976" y="776" font-size="13" fill="#64748B" font-family="system-ui, sans-serif">Parametric + generative design workflows</text>
