  <text x="460" y="41" font-size="14" fill="#B0CCE8" font-family="system-ui, sans-serif">Projects</text>
  <text x="580" y="41" font-size="14" fill="#B0CCE8" font-family="system-ui, sans-serif">Competitions</text>
  <text x="740" y="41" font-size="14" fill="#B0CCE8" font-family="system-ui, sans-serif">Team</text>
  <text x="830" y="41" font-size="14" fill="#B0CCE8" font-family="system-ui, sans-serif">Sponsors</text>
  <text x="950" y="41" font-size="14" fill="#B0CCE8" font-family="system-ui, sans-serif">Contact</text>
