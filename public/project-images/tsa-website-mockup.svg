  <text x="200" y="516" text-anchor="middle" font-size="10" fill="#94A3B8" font-family="system-ui, sans-serif" letter-spacing="2">ACTIVE MEMBERS</text>
  <line x1="400" y1="466" x2="400" y2="518" stroke="#E2E8F0" stroke-width="1"/>
