  <text x="524" y="686" font-size="10" fill="#D97706" font-family="system-ui, sans-serif" font-weight="700" letter-spacing="2">DOCUMENTATION</text>
  <text x="524" y="712" font-size="20" font-weight="800" fill="#0F172A" font-family="system-ui, sans-serif">Engineering Notebook (ESN)</text>
  <text x="524" y="736" font-size="13" fill="#64748B" font-family="system-ui, sans-serif">32-page full-semester design record</text>
  <text x="524" y="756" font-size="13" fill="#64748B" font-family="system-ui, sans-serif">Slingshot · Conveyor · Speed Multiplier</text>
  <text x="524" y="776" font-size="13" fill="#64748B" font-family="system-ui, sans-serif">Full calculations + CAD integration</text>
