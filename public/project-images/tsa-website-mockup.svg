  <rect x="48" y="648" width="400" height="200" rx="12" fill="#EFF6FF" filter="url(#cardShadow)"/>
  <rect x="48" y="648" width="400" height="6" rx="6" fill="#1D4ED8"/>
  <text x="72" y="686" font-size="10" fill="#2563EB" font-family="system-ui, sans-serif" font-weight="700" letter-spacing="2">UAV SYSTEMS</text>
  <text x="72" y="712" font-size="20" font-weight="800" fill="#0F172A" font-family="system-ui, sans-serif">FPV Safari Rescue Drone</text>
